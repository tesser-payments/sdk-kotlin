# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

# Dokka V2 plugin mode — required as of Dokka 2.0.0; V1 mode is deprecated and
# will be removed in Dokka 2.1.0. The "WithHelpers" suffix keeps the legacy DSL
# (`dokkaHtml`, `dokkaJavadoc`, etc.) working as compatibility shims so Vanniktech's
# javadoc-jar wiring continues to function.
# Migration guide: https://kotl.in/dokka-gradle-migration
org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers

# Configuration cache: still disabled because the V1-compat helper tasks (which
# Vanniktech relies on for the javadoc jar) serialize a Gradle Configuration that
# the config cache can't handle. Tracked: https://github.com/Kotlin/dokka/issues/3088
# Re-enable when (a) Dokka ships a config-cache-safe javadoc-jar task or
# (b) we migrate to pure V2 mode (`V2Enabled` without helpers) and rewire Vanniktech.
org.gradle.configuration-cache=false

# Project tuning
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
