# Published artifact coordinates. Bump `version` (manually) when ready to cut a
# new release; pushing the bump to `main` triggers `.github/workflows/release.yml`,
# which publishes to Maven Central and creates a matching `v<version>` git tag.
group=xyz.tesser
version=0.0.2

# Dokka V2 plugin mode (pure V2, no V1-compat helpers). Vanniktech 0.30+ wires
# its javadoc jar through Dokka's V2 native task (`mavenDokkaJavadocJar`).
# Migration guide: https://kotl.in/dokka-gradle-migration
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
# Silence the "Thank you for enabling Dokka Gradle plugin V2!" info message on every build.
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# Configuration cache enabled. Pure V2 Dokka tasks are config-cache-safe;
# this was previously off because the V1-compat helpers (or V1 itself) serialized
# a Gradle Configuration object that the cache couldn't handle.
org.gradle.configuration-cache=true

# Project tuning
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true